# Portfolio Backend — Nginx Reverse Proxy
# Place in /etc/nginx/sites-available/portfolio-api

# Rate limiting zone
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

# Upstream — PM2 cluster
upstream portfolio_api {
    least_conn;
    server 127.0.0.1:5000;
    keepalive 64;
}

server {
    listen 80;
    server_name api.pritish-dev.com;

    # Redirect HTTP → HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.pritish-dev.com;

    # ── SSL (Let's Encrypt / Certbot) ──
    ssl_certificate     /etc/letsencrypt/live/api.pritish-dev.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.pritish-dev.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ── Security Headers ──
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ── Rate Limiting ──
    limit_req zone=api burst=20 nodelay;
    limit_req_status 429;

    # ── Body Size ──
    client_max_body_size 10K;
    client_body_timeout 10s;
    client_header_timeout 10s;

    # ── Proxy to Node.js ──
    location /api/ {
        proxy_pass http://portfolio_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # Gzip
        gzip on;
        gzip_types application/json text/plain;
        gzip_min_length 256;
    }

    # ── Block dotfiles ──
    location ~ /\. {
        deny all;
        return 404;
    }

    # ── Health check (no rate limit) ──
    location = /api/health {
        proxy_pass http://portfolio_api;
        proxy_http_version 1.1;
        limit_req off;
    }
}
